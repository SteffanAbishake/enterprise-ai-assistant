services:
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  ui:
    build: .
    environment:
      API_URL: http://api:8000
    command: ["streamlit", "run", "frontend/chat.py", "--server.address", "0.0.0.0", "--browser.gatherUsageStats", "false"]
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      api:
        condition: service_healthy
